# Panel de edición: https://app.pagescms.org (entrar con GitHub e abrir este repositorio).
# Cada sección corresponde a unha carpeta de src/content/. Ao gardar, a web publícase soa.

media:
  - name: imaxes
    label: Imaxes
    input: src/assets/media
    # Ruta relativa desde src/content/<colección>/ (o que precisa Astro para optimizar as imaxes)
    output: ../../assets/media
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif, gif, svg]
  - name: documentos
    label: Documentos (PDF…)
    input: public/documentos
    output: /feiradasostibilidade/documentos
    rename: safe
    categories: [document, spreadsheet, compressed]

content:
  # ───────────── NOTICIAS ─────────────
  - name: noticias
    label: Noticias
    type: collection
    path: src/content/noticias
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [titulo, data, edicion, borrador]
      primary: titulo
      sort: [data, titulo]
      default:
        sort: data
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: data
        label: Data
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: resumo
        label: Resumo
        description: Unha ou dúas frases. Aparece nas tarxetas e baixo o título.
        type: text
        required: true
      - name: edicion
        label: Edición da Feira
        description: Opcional. A noticia aparecerá tamén na páxina desa edición.
        type: reference
        options:
          collection: edicions
          value: "{path}"
          label: "{fields.titulo}"
      - name: imaxe
        label: Imaxe principal
        type: image
        options:
          media: imaxes
      - name: imaxeAlt
        label: Descrición da imaxe (accesibilidade)
        description: Que se ve na foto, en poucas palabras.
        type: string
      - name: borrador
        label: Borrador (non publicar aínda)
        type: boolean
        default: false
      - name: body
        label: Texto
        type: rich-text
        options:
          media: imaxes

  # ───────────── EDICIÓNS ─────────────
  - name: edicions
    label: Edicións da Feira
    type: collection
    path: src/content/edicions
    filename: "{ano}.md"
    view:
      fields: [titulo, datas, estado]
      primary: titulo
      sort: [ano]
      default:
        sort: ano
        order: desc
    fields:
      - name: numero
        label: Número de edición (1, 2, 3…)
        type: number
        required: true
      - name: ano
        label: Ano
        type: number
        required: true
      - name: titulo
        label: Título
        description: Ex. «VI Feira da Sostibilidade»
        type: string
        required: true
      - name: lema
        label: Lema
        type: string
      - name: datas
        label: Datas (texto)
        description: Ex. «28, 29 e 30 de abril de 2027»
        type: string
        required: true
      - name: lugar
        label: Lugar
        type: string
        required: true
      - name: estado
        label: Estado
        type: select
        required: true
        options:
          values:
            - name: proxima
              label: Próxima
            - name: pasada
              label: Pasada
      - name: resumo
        label: Resumo
        type: text
        required: true
      - name: portada
        label: Foto de portada
        type: image
        options:
          media: imaxes
      - name: portadaAlt
        label: Descrición da foto de portada
        type: string
      - name: cifras
        label: Cifras
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{valor} {etiqueta}"
        fields:
          - name: valor
            label: Valor (ex. «1.127»)
            type: string
            required: true
          - name: etiqueta
            label: Etiqueta (ex. «participantes»)
            type: string
            required: true
      - name: fitos
        label: Fitos destacados
        type: string
        list: true
      - name: programa
        label: Programa
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{dia}"
        fields:
          - name: dia
            label: Día
            type: string
            required: true
          - name: actividades
            label: Actividades
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{hora} {titulo}"
            fields:
              - name: hora
                label: Hora
                type: string
              - name: titulo
                label: Título
                type: string
                required: true
              - name: descricion
                label: Descrición
                type: text
      - name: centros
        label: Centros educativos
        type: string
        list: true
      - name: entidades
        label: Entidades (organizan, financian, colaboran)
        type: reference
        options:
          collection: entidades
          multiple: true
          value: "{path}"
          label: "{fields.nome}"
          search: nome
      - name: galeria
        label: Galería
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: imaxe
            label: Imaxe
            type: image
            required: true
            options:
              media: imaxes
          - name: alt
            label: Descrición
            type: string
            required: true
      - name: videos
        label: Vídeos
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
            required: true
          - name: url
            label: Ligazón (YouTube, Vimeo…)
            type: string
            required: true
      - name: documentos
        label: Documentos (memorias…)
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
            required: true
          - name: url
            label: Ficheiro ou ligazón
            description: Sube o PDF en «Documentos» e copia aquí a súa ruta, ou pega unha ligazón.
            type: string
      - name: prensa
        label: Na prensa
        type: object
        list: true
        fields:
          - name: medio
            label: Medio
            type: string
            required: true
          - name: titulo
            label: Título da peza
            type: string
          - name: url
            label: Ligazón
            type: string
      - name: proxecto
        label: Proxecto vinculado
        type: reference
        options:
          collection: proxectos
          value: "{path}"
          label: "{fields.nomeCurto}"
      - name: body
        label: Presentación
        type: rich-text
        options:
          media: imaxes

  # ───────────── ENTIDADES ─────────────
  - name: entidades
    label: Entidades e logos
    type: collection
    path: src/content/entidades
    format: yaml
    filename: "{primary}.yaml"
    view:
      fields: [nome, papel]
      primary: nome
      sort: [nome, papel]
      default:
        sort: nome
        order: asc
    fields:
      - name: nome
        label: Nome
        type: string
        required: true
      - name: papel
        label: Papel
        type: select
        required: true
        options:
          values:
            - name: organiza
              label: Organiza
            - name: financia
              label: Financia
            - name: colabora
              label: Colabora
            - name: centro
              label: Centro educativo
      - name: logo
        label: Logo
        type: image
        options:
          media: imaxes
      - name: web
        label: Web
        description: Enderezo completo, con https://
        type: string
      - name: orde
        label: Orde (menor = primeiro)
        type: number
        default: 100

  # ───────────── RECURSOS ─────────────
  - name: recursos
    label: Recursos
    type: collection
    path: src/content/recursos
    filename: "{primary}.md"
    view:
      fields: [titulo, tipo]
      primary: titulo
      sort: [titulo]
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: tipo
        label: Tipo
        type: select
        required: true
        options:
          values:
            - name: xogo
              label: Xogo educativo
            - name: podcast
              label: Podcast
            - name: estudo
              label: Estudo e investigación
            - name: guia
              label: Guía
            - name: audiovisual
              label: Audiovisual
            - name: obradoiro
              label: Obradoiro
            - name: outro
              label: Outro
      - name: resumo
        label: Resumo
        type: text
        required: true
      - name: edicion
        label: Edición da Feira
        type: reference
        options:
          collection: edicions
          value: "{path}"
          label: "{fields.titulo}"
      - name: temas
        label: Temas
        type: string
        list: true
      - name: ods
        label: ODS (números do 1 ao 17)
        type: number
        list: true
        options:
          min: 1
          max: 17
      - name: ligazon
        label: Ligazón externa
        description: Enderezo completo, con https://
        type: string
      - name: ficheiro
        label: Ficheiro descargable
        type: file
        options:
          media: documentos
      - name: imaxe
        label: Imaxe
        type: image
        options:
          media: imaxes
      - name: imaxeAlt
        label: Descrición da imaxe
        type: string
      - name: autoria
        label: Autoría
        type: string
      - name: licenza
        label: Licenza
        type: string
        default: CC BY-SA 4.0
      - name: body
        label: Descrición completa
        type: rich-text
        options:
          media: imaxes

  # ───────────── PROXECTOS ─────────────
  - name: proxectos
    label: Proxectos (SENDA 2030…)
    type: collection
    path: src/content/proxectos
    filename: "{primary}.md"
    view:
      fields: [nomeCurto]
      primary: nomeCurto
    fields:
      - name: titulo
        label: Título completo
        type: string
        required: true
      - name: nomeCurto
        label: Nome curto
        type: string
        required: true
      - name: edicion
        label: Edición da Feira á que pertence
        type: reference
        required: true
        options:
          collection: edicions
          value: "{path}"
          label: "{fields.titulo}"
      - name: resumo
        label: Resumo
        type: text
        required: true
      - name: financiamento
        label: Texto de financiamento
        type: text
        required: true
      - name: entidades
        label: Entidades (promoven e financian)
        type: reference
        options:
          collection: entidades
          multiple: true
          value: "{path}"
          label: "{fields.nome}"
          search: nome
      - name: cifras
        label: Cifras
        type: object
        list: true
        fields:
          - name: valor
            label: Valor
            type: string
            required: true
          - name: etiqueta
            label: Etiqueta
            type: string
            required: true
      - name: actividades
        label: Actividades
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{codigo} · {titulo}"
        fields:
          - name: codigo
            label: Código
            type: string
            required: true
          - name: resultado
            label: Resultado
            type: string
            required: true
          - name: titulo
            label: Título
            type: string
            required: true
          - name: descricion
            label: Descrición
            type: text
            required: true
          - name: estado
            label: Estado
            type: select
            required: true
            options:
              values:
                - name: prevista
                  label: Prevista
                - name: en-curso
                  label: En curso
                - name: feita
                  label: Feita
      - name: body
        label: Presentación
        type: rich-text
