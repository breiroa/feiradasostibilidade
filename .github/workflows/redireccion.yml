# GitHub Pages xa non aloxa a web: só redirixe ao novo enderezo en Cloudflare.
name: Redirección GitHub Pages

on:
  push:
    branches: [main]
    paths: ['redireccion/**', '.github/workflows/redireccion.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redireccion
      - id: deployment
        uses: actions/deploy-pages@v5
